<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小学生向け算数学習アプリ (V2.9.0)</title>
    <meta name="description" content="サーバー不要・ブラウザだけで手軽に遊べる小学生向け算数学習Webアプリ">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a90d9">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- アプリ本体コンテナ -->
  <div id="app-container">
    <div style="padding: 40px; text-align: center; color: #64748b;">
      <h2>アプリを読み込み中...</h2>
    </div>
  </div>

  <!-- スクリプト群 (レイヤー順に読み込み) -->
  <!-- 1. 設定 & レジストリ -->
  <script src="js/config.js"></script>
  <script src="js/registries.js"></script>
  <script src="js/diversity_selector.js"></script>

  <!-- 2. スキーマ & ストレージ & マイグレーション -->
  <script src="js/schema.js"></script>
  <script src="js/migration.js"></script>
  <script src="js/storage.js"></script>

  <!-- 2.5 図形SVG共通部品 (FigureSVG: G1/G2レガシー互換 + figure_tap の描画) -->
  <script src="js/figure_svg.js"></script>

  <!-- 3. バリデータ & テンプレート & 生成系 -->
  <script src="js/validator.js"></script>
  <script src="js/templates_math.js"></script>
  <script src="js/templates_units_p1.js"></script>
  <script src="js/templates_units_p2.js"></script>
  <script src="js/templates_g2_extra.js"></script>
  <script src="js/templates_figures_g1.js"></script>
  <script src="js/templates_figures_g2.js"></script>
  <script src="js/templates_figures_g3.js"></script>
  <script src="js/clock_svg.js"></script>
  <script src="js/templates_clock.js"></script>
  <!-- V2.9.0 筆算SVG共通部品 (HissanSVG: 加減乗除の筆算描画) -->
  <script src="js/hissan_svg.js"></script>
  <script src="js/question_source.js"></script>

  <!-- 4. 学習コアエンジン群 -->
  <script src="js/learning_score_engine.js"></script>
  <script src="js/learning_engine.js"></script>
  <script src="js/unit_selector.js"></script>
  <script src="js/review_engine.js"></script>
  <script src="js/level_engine.js"></script>
  <script src="js/gamification_engine.js"></script>
  <script src="js/test_engine.js"></script>
  <script src="js/session_coordinator.js"></script>
  <script src="js/parent_dashboard.js"></script>

    <!-- 5. 音響 & UIコントローラー -->
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  
  <!-- PWA Service Worker登録 + 自動更新検知 (V2.6.10) -->
  <div id="app-update-bar" class="app-update-banner" hidden>
    <span class="update-text">✨ 新しいバージョンがあります</span>
    <button id="app-update-btn" class="btn-update" type="button">今すぐ更新</button>
  </div>
  <script>
    (function () {
      var updateBar = document.getElementById('app-update-bar');
      var updateBtn = document.getElementById('app-update-btn');
      var refreshing = false;
      function isLearning() {
        try {
          var screen = (typeof app !== 'undefined' && app.currentScreen) ? app.currentScreen : '';
          if (screen === 'learning' || screen === 'test') return true;
          if (typeof app !== 'undefined' && app.session) {
            var s = app.session;
            if ((s.questionCount > 0) && (s.currentIndex < s.questionCount)) return true;
          }
        } catch (e) { /* ignore */ }
        return false;
      }
      function showUpdateBar(waiting) {
        if (!updateBar) return;
        updateBar.hidden = false;
        var text = updateBar.querySelector('.update-text');
        if (text) {
          text.textContent = isLearning()
            ? '✨ 新しいバージョンがあります（学習後に更新されます）'
            : '✨ 新しいバージョンがあります';
        }
        if (updateBtn) {
          updateBtn.onclick = function () {
            if (!waiting) { window.location.reload(); return; }
            try { waiting.postMessage({ type: 'SKIP_WAITING' }); }
            catch (e) { window.location.reload(); }
          };
        }
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(function (reg) {
            console.log('[PWA] SW登録成功:', reg.scope);
            // 待機中の新SWがあれば通知
            if (reg.waiting) showUpdateBar(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBar(nw);
                }
              });
            });
          })
          .catch(function (err) { console.error('[PWA] SW登録失敗:', err); });
        // 新SWが有効化されたら一度だけリロード（学習中は結果画面遷移後に反映）
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          if (isLearning()) {
            var iv = setInterval(function () {
              if (!isLearning()) { clearInterval(iv); window.location.reload(); }
            }, 2000);
            // 安全弁: 5分経っても学習中なら強制リロードしない (バナー継続表示)
            setTimeout(function () { clearInterval(iv); refreshing = false; }, 5 * 60 * 1000);
          } else {
            window.location.reload();
          }
        });
        // 起動時に更新チェック
        setInterval(function () {
          try {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) reg.update().catch(function () {});
            });
          } catch (e) { /* ignore */ }
        }, 60 * 60 * 1000);
      }
    })();
  </script>

  <script>
    // アプリ初期化
    window.addEventListener("DOMContentLoaded", () => {
      app.init();
      // V2.6.11 (案Aおまけ): PC物理キーボードで時計入力 (数字/Backspace/Enter)
      document.addEventListener("keydown", (ev) => {
        try {
          if (typeof app !== "undefined" && app && typeof app.handleClockPhysicalKey === "function") {
            app.handleClockPhysicalKey(ev);
          }
        } catch (e) { /* ignore */ }
      });
    });
  </script>
</body>
</html>
